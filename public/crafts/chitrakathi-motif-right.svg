<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" fill="none" stroke="currentColor">
  <!-- Authentic Pinguli Chitrakathi Folk Art Motif (Maharashtra Sacred Elephant & Tree Scroll) -->
  <g stroke="#DDA73A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Traditional Floral Arch Frame -->
    <path d="M20 300 V70 Q120 10 220 70 V300" stroke-width="3" stroke-dasharray="2 4"/>
    <path d="M30 290 V75 Q120 25 210 75 V290" stroke-width="1.5"/>

    <!-- Sacred Kalasha / Lotus Finial -->
    <path d="M110 40 Q120 20 130 40 Q120 50 110 40 Z" fill="#F59E0B" fill-opacity="0.2"/>
    <circle cx="120" cy="18" r="3" fill="#C85A32"/>

    <!-- Tree of Life Foliage (Chitrakathi Stylized Leaves) -->
    <path d="M120 55 Q100 70 85 65 Q95 85 120 80 Q145 85 155 65 Q140 70 120 55 Z" stroke-width="2" fill="#C85A32" fill-opacity="0.15"/>
    <path d="M120 80 V130" stroke-width="2.5" stroke="#C85A32"/>
    <circle cx="80" cy="90" r="8" fill="#F59E0B" fill-opacity="0.2"/>
    <circle cx="160" cy="90" r="8" fill="#F59E0B" fill-opacity="0.2"/>
    <circle cx="120" cy="100" r="6" fill="#DDA73A" fill-opacity="0.3"/>

    <!-- Chitrakathi Royal Elephant (Gaja) with Ornate Howdah & Bell -->
    <!-- Elephant Head & Curved Trunk (Prominent Almond Eye) -->
    <path d="M90 180 Q85 150 110 145 Q140 140 160 160 Q175 180 180 200" stroke-width="2.5"/>
    <!-- Trunk curling upward -->
    <path d="M85 170 Q70 180 65 210 Q60 230 75 235 Q85 235 80 220 Q75 200 95 190" stroke-width="2" fill="#C85A32" fill-opacity="0.1"/>
    <!-- Large Almond Eye -->
    <ellipse cx="105" cy="160" rx="6" ry="3.5" fill="#241E1C"/>
    <path d="M98 156 Q107 152 112 157" stroke-width="1.5"/>
    <!-- Ear with traditional dot-work -->
    <path d="M115 150 Q130 145 135 165 Q130 185 115 175 Z" stroke-width="1.8" fill="#DDA73A" fill-opacity="0.25"/>

    <!-- Elephant Tusk (Danta) -->
    <path d="M95 180 Q80 190 70 185" stroke-width="2.5" stroke="#FAF8F5"/>

    <!-- Body & Royal Saddle (Jhul) -->
    <path d="M140 155 Q190 160 205 190 Q215 220 205 260 L185 260 L180 220 L150 220 L145 260 L125 260 L130 200 Z" stroke-width="2.5" fill="#C85A32" fill-opacity="0.15"/>
    
    <!-- Ornate Jhul Textile Pattern (Traditional Diamonds & Zari) -->
    <rect x="135" y="170" width="45" height="35" rx="4" stroke-width="1.5" fill="#F59E0B" fill-opacity="0.2"/>
    <path d="M140 175 L175 200 M175 175 L140 200" stroke-width="1.2"/>
    <!-- Hanging Temple Bells (Ghanti) -->
    <circle cx="145" cy="210" r="3" fill="#DDA73A"/>
    <circle cx="158" cy="210" r="3" fill="#DDA73A"/>
    <circle cx="170" cy="210" r="3" fill="#DDA73A"/>

    <!-- Legs & Pedestal Ground -->
    <line x1="85" y1="260" x2="105" y2="260" stroke-width="2"/>
    <path d="M40 290 Q120 270 200 290" stroke-width="2"/>
    <circle cx="70" cy="285" r="4" fill="#C85A32" fill-opacity="0.3"/>
    <circle cx="120" cy="280" r="5" fill="#DDA73A" fill-opacity="0.4"/>
    <circle cx="170" cy="285" r="4" fill="#C85A32" fill-opacity="0.3"/>
  </g>
</svg>
